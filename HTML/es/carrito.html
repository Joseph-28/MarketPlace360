<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarketPlace 360 | Carrito</title>
    <link rel="icon" href="/img/logo.png" type="image/png">
    <link rel="stylesheet" href="/CSS/all.min.css">
    <link rel="stylesheet" href="/CSS/style.css">
    <link rel="stylesheet" href="/CSS/global.css">
    <link rel="stylesheet" href="/CSS/footer.css">
    <link rel="stylesheet" href="/CSS/header.css">
    <link rel="stylesheet" href="/CSS/Bodys/carrito.css">
    <script src="/JS/productos.js"></script>
    <script src="/JS/componentes.js"></script>
    <script src="/JS/main.js"></script>
    <script src="/JS/Bodys/carrito.js"></script>
</head>

<body>
    <header id="header"></header>
    <main>
        <h1>Mi Carrito de Compras</h1>
        <section class="contenedor_carrito">
            <!-- Productos -->
            <section class="carrito_izquierda">

            </section>
            <!-- Resumen de compra -->
            <section class="carrito_derecha">
                <h2>Generar Compra</h2>
                <p>Subtotal: <span id="subtotal">₡0</span></p>
                <p>Envío: <span id="envio">₡0</span></p>
                <p>Descuento: <span id="descuento">₡0</span></p>
                <p class="descuento">Ingrese un código de descuento:
                    <input type="text" id="codigo_descuento">
                </p>
                <p><strong>Total: <span id="total">₡0</span></strong></p>
                <button id="btn_pagar" type="button">Realizar Pago</button>
            </section>
        </section>
    </main>
    <footer id="footer"></footer>

    <!-- Alertas -->
    <section id="alerta" class="alerta"></section>
</body>

</html>
